<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学配对大挑战</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: 'PingFang SC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Confetti Canvas */
        #confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            perspective: 1000px;
            margin-top: 30px;
        }

        .card {
            width: 80px;
            height: 80px;
            background-color: transparent;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        @media (min-width: 768px) {
            .card {
                width: 100px;
                height: 100px;
            }
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .card-front {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            transform: rotateY(180deg);
            border: 2px solid #60a5fa;
        }

        .card-back {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            font-weight: bold;
            color: #94a3b8;
        }
        
        .card-back::after {
            content: "?";
        }

        .card.matched .card-front {
            background: linear-gradient(135deg, #10b981, #059669);
            border-color: #34d399;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #94a3b8;
        }

        .btn-restart {
            margin-top: 30px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            z-index: 10;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="confetti"></canvas>
    
    <div class="text-center z-10">
        <h1 class="text-4xl font-black mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">🧠 科学配对大挑战</h1>
        <p class="text-slate-400">完成练习的专属奖励！找出所有相同的科学图标。</p>
    </div>

    <div class="stats z-10">
        <div>步数: <span id="moves" class="text-white">0</span></div>
        <div>时间: <span id="time" class="text-white">0</span>s</div>
    </div>

    <div class="game-board" id="board">
        <!-- Cards generated by JS -->
    </div>

    <button class="btn-restart" onclick="initGame()">再玩一次</button>

    <script>
        const emojis = ['🧬', '🔬', '🔭', '🧠', '🫁', '🩸', '🦠', '🧪'];
        let cards = [...emojis, ...emojis];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = null;
        let seconds = 0;
        let isLocked = false;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            clearInterval(timer);
            seconds = 0;
            moves = 0;
            matchedPairs = 0;
            flippedCards = [];
            isLocked = false;
            
            document.getElementById('time').textContent = '0';
            document.getElementById('moves').textContent = '0';
            document.getElementById('confetti').style.display = 'none';

            const board = document.getElementById('board');
            board.innerHTML = '';
            
            cards = shuffle(cards);

            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                card.dataset.emoji = emoji;

                card.innerHTML = `
                    <div class="card-face card-front">${emoji}</div>
                    <div class="card-face card-back"></div>
                `;

                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });
            
            timer = setInterval(() => {
                seconds++;
                document.getElementById('time').textContent = seconds;
            }, 1000);
        }

        function flipCard(card) {
            if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const match = card1.dataset.emoji === card2.dataset.emoji;

            if (match) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                flippedCards = [];

                if (matchedPairs === emojis.length) {
                    clearInterval(timer);
                    setTimeout(triggerWin, 500);
                }
            } else {
                isLocked = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isLocked = false;
                }, 1000);
            }
        }

        // Simple Confetti
        function triggerWin() {
            document.getElementById('confetti').style.display = 'block';
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 10 + 5,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    speed: Math.random() * 3 + 2,
                    angle: Math.random() * Math.PI * 2,
                    spin: Math.random() * 0.2 - 0.1
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.y += p.speed;
                    p.x += Math.sin(p.angle) * 2;
                    p.angle += p.spin;
                    
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    ctx.restore();

                    if (p.y > canvas.height) {
                        p.y = -10;
                        p.x = Math.random() * canvas.width;
                    }
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        initGame();
    </script>
</body>
</html>
