<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太平华联中学初二科学</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        .glass-sidebar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(229, 231, 235, 0.8);
        }
        .nav-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-item.active {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transform: translateX(4px);
        }
        .nav-item:hover:not(.active) {
            background: rgba(59, 130, 246, 0.08);
            transform: translateX(4px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: floatAnim 3s ease-in-out infinite;
        }
        .bg-polka {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-polka flex h-screen w-full overflow-hidden">

    <!-- Mobile Overlay -->
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/40 z-20 hidden md:hidden backdrop-blur-sm transition-opacity" onclick="toggleSidebar()"></div>

    <!-- REGISTRATION MODAL -->
    <div id="registration-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 transform transition-transform duration-300 scale-100">
            <h2 class="text-2xl font-black text-center mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">🌟 创建你的学习角色</h2>
            <p class="text-slate-500 text-center text-sm mb-6">请输入名字并选择你的专属熊猫吉祥物，准备开始挑战！</p>
            
            <div class="mb-5">
                <label class="block text-sm font-bold text-slate-700 mb-2">你的名字</label>
                <input type="text" id="student-name-input" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all" placeholder="例如：张小明">
            </div>
            
            <label class="block text-sm font-bold text-slate-700 mb-2">选择吉祥物</label>
            <div class="grid grid-cols-4 gap-3 mb-8" id="avatar-selection">
                <div class="avatar-option cursor-pointer rounded-xl border-2 border-blue-500 bg-blue-50 p-2 text-center transition-all" onclick="selectAvatar('panda_scientist.png', this)">
                    <img src="assets/panda_scientist.png" class="w-16 h-16 rounded-full mx-auto shadow-sm object-cover bg-white" alt="Scientist">
                </div>
                <div class="avatar-option cursor-pointer rounded-xl border-2 border-transparent hover:border-pink-300 p-2 text-center transition-all" onclick="selectAvatar('panda_doctor.png', this)">
                    <img src="assets/panda_doctor.png" class="w-16 h-16 rounded-full mx-auto shadow-sm object-cover bg-white" alt="Doctor">
                </div>
                <div class="avatar-option cursor-pointer rounded-xl border-2 border-transparent hover:border-orange-300 p-2 text-center transition-all" onclick="selectAvatar('panda_astronaut.png', this)">
                    <img src="assets/panda_astronaut.png" class="w-16 h-16 rounded-full mx-auto shadow-sm object-cover bg-white" alt="Astronaut">
                </div>
                <div class="avatar-option cursor-pointer rounded-xl border-2 border-transparent hover:border-green-300 p-2 text-center transition-all" onclick="selectAvatar('panda_explorer.png', this)">
                    <img src="assets/panda_explorer.png" class="w-16 h-16 rounded-full mx-auto shadow-sm object-cover bg-white" alt="Explorer">
                </div>
            </div>
            
            <button onclick="submitRegistration()" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:-translate-y-0.5 transition-all">
                🚀 开始学习之旅！
            </button>
        </div>
    </div>

    <!-- LEADERBOARD WIDGET -->
    <div id="leaderboard-widget" class="fixed bottom-6 left-6 md:left-[310px] z-40 bg-white/95 backdrop-blur-md border border-slate-200 shadow-2xl rounded-2xl w-72 overflow-hidden hidden transform transition-all duration-500 translate-y-4 opacity-0">
        <div class="bg-gradient-to-r from-indigo-600 to-blue-600 p-3 flex justify-between items-center cursor-pointer" onclick="toggleLeaderboard()">
            <h3 class="text-white font-bold text-sm"><i class="fa-solid fa-trophy text-yellow-300 mr-2"></i> 学霸风云榜</h3>
            <i id="lb-chevron" class="fa-solid fa-chevron-down text-white/80 text-xs transition-transform"></i>
        </div>
        <div id="lb-content" class="p-3 transition-all duration-300" style="display: block;">
            <ul id="lb-list" class="space-y-2">
                <!-- Dynamically populated -->
            </ul>
        </div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 glass-sidebar flex flex-col shadow-2xl md:shadow-xl z-30 fixed md:relative h-full transition-transform duration-300 -translate-x-full md:translate-x-0">
        <div class="p-6 border-b border-slate-200 flex justify-between items-center relative z-20 bg-white">
            <div>
                <h1 class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600 tracking-tight">
                    <i class="fa-solid fa-flask mr-2 text-blue-600"></i>太平华联中学
                </h1>
                <p class="text-slate-500 text-sm mt-2 font-medium">初二科学复习系统</p>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-600 transition-colors">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
        </div>

        <nav class="flex-1 p-4 space-y-3 overflow-y-auto relative z-20">
            <!-- Panda Mascot -->
            <div class="flex justify-center -mt-2 mb-4 animate-float">
                <img src="assets/panda_astronaut.png" class="w-20 h-20 rounded-full border-4 border-white shadow-md bg-white object-cover" alt="Mascot">
            </div>
            <a href="初二第3章复习.html" target="content-frame" class="nav-item active flex items-center p-3 rounded-xl text-slate-700 font-medium cursor-pointer" onclick="setActive(this, 'blue')">
                <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center mr-3 nav-icon transition-colors">
                    <i class="fa-solid fa-brain text-lg"></i>
                </div>
                <div>
                    <div class="text-sm font-bold">第3章</div>
                    <div class="text-xs opacity-80 mt-0.5">协调与恒定</div>
                </div>
            </a>

            <a href="初二第四章复习.html" target="content-frame" class="nav-item flex items-center p-3 rounded-xl text-slate-700 font-medium cursor-pointer" onclick="setActive(this, 'emerald')">
                <div class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center mr-3 nav-icon transition-colors">
                    <i class="fa-solid fa-lungs text-lg"></i>
                </div>
                <div>
                    <div class="text-sm font-bold">第4章</div>
                    <div class="text-xs opacity-80 mt-0.5">人体的呼吸</div>
                </div>
            </a>

            <a href="力与压强学习系统.html" target="content-frame" class="nav-item flex items-center p-3 rounded-xl text-slate-700 font-medium cursor-pointer" onclick="setActive(this, 'orange')">
                <div class="w-10 h-10 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center mr-3 nav-icon transition-colors">
                    <i class="fa-solid fa-weight-hanging text-lg"></i>
                </div>
                <div>
                    <div class="text-sm font-bold">第8章</div>
                    <div class="text-xs opacity-80 mt-0.5">力与压强</div>
                </div>
            </a>
        </nav>

        <div class="p-6 border-t border-slate-200 text-center">
            <div class="text-sm font-black text-slate-800 mb-1 tracking-wide">Developed by ChamCH</div>
            <div class="text-xs text-slate-400 mb-4 font-medium">For Github Pages Deployment</div>
            <a href="https://github.com/vincecham91-png/sc" target="_blank" class="inline-flex items-center justify-center w-full py-2.5 px-4 border border-slate-300 rounded-lg text-sm font-bold text-slate-700 bg-white hover:bg-slate-50 hover:text-slate-900 transition-all shadow-sm">
                <i class="fa-brands fa-github mr-2 text-lg"></i> View Source
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 bg-white relative flex flex-col h-full w-full overflow-hidden">
        
        <!-- Mobile Header -->
        <header class="md:hidden flex items-center justify-between p-4 bg-white border-b z-10 shadow-sm relative shrink-0">
            <div class="flex items-center">
                <i class="fa-solid fa-flask mr-2 text-blue-600 text-xl"></i>
                <h1 class="text-lg font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600 tracking-tight">太平华联中学科学</h1>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-600 p-2 rounded-lg hover:bg-slate-100 transition-colors">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
        </header>

        <div id="loader" class="absolute inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-10 transition-opacity duration-300">
            <div class="flex flex-col items-center">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600 mb-4"></i>
                <p class="text-slate-600 font-bold tracking-wide mt-2">加载内容中...</p>
            </div>
        </div>
        
        <div class="flex-1 w-full h-full relative">
            <iframe name="content-frame" id="content-frame" src="初二第3章复习.html" class="absolute inset-0 w-full h-full" onload="hideLoader()"></iframe>
        </div>
    </main>

    <script>
        // GLOBAL STATE FOR GAMIFICATION
        window.studentName = "";
        window.studentAvatar = "";
        window.studentScore = 0;
        
        let leaderboardData = [
            { name: "学霸小明", avatar: "assets/panda_astronaut.png", score: 150 },
            { name: "班长小红", avatar: "assets/panda_doctor.png", score: 85 },
            { name: "课代表", avatar: "assets/panda_explorer.png", score: 45 }
        ];

        let selectedAvatarPath = "assets/panda_scientist.png"; // default
        
        function selectAvatar(filename, el) {
            selectedAvatarPath = "assets/" + filename;
            document.querySelectorAll('.avatar-option').forEach(opt => {
                opt.classList.remove('border-blue-500', 'bg-blue-50');
                opt.classList.add('border-transparent');
            });
            el.classList.remove('border-transparent');
            el.classList.add('border-blue-500', 'bg-blue-50');
        }

        function submitRegistration() {
            const nameInput = document.getElementById('student-name-input').value.trim();
            if (!nameInput) {
                alert("请输入你的名字哦！");
                return;
            }
            window.studentName = nameInput;
            window.studentAvatar = selectedAvatarPath;
            window.studentScore = 0;
            
            // Hide modal
            const modal = document.getElementById('registration-modal');
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 300);
            
            // Show leaderboard
            leaderboardData.push({ name: window.studentName, avatar: window.studentAvatar, score: window.studentScore, isMe: true });
            renderLeaderboard();
            
            const lbWidget = document.getElementById('leaderboard-widget');
            lbWidget.classList.remove('hidden');
            setTimeout(() => {
                lbWidget.classList.remove('translate-y-4', 'opacity-0');
            }, 100);
        }

        function toggleLeaderboard() {
            const content = document.getElementById('lb-content');
            const icon = document.getElementById('lb-chevron');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.style.display = 'none';
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function renderLeaderboard() {
            leaderboardData.sort((a, b) => b.score - a.score);
            const list = document.getElementById('lb-list');
            list.innerHTML = '';
            
            leaderboardData.forEach((player, index) => {
                const isMe = player.isMe ? 'bg-blue-50 border border-blue-100' : '';
                const rankColor = index === 0 ? 'text-yellow-500' : index === 1 ? 'text-slate-400' : index === 2 ? 'text-amber-600' : 'text-slate-300';
                
                list.innerHTML += `
                    <li class="flex items-center justify-between p-2 rounded-lg ${isMe} transition-all">
                        <div class="flex items-center">
                            <span class="w-5 font-bold ${rankColor} text-sm mr-1">${index + 1}</span>
                            <img src="${player.avatar}" class="w-8 h-8 rounded-full shadow-sm mr-2 border border-slate-200 object-cover bg-white">
                            <span class="text-sm font-bold text-slate-700 ${player.isMe ? 'text-blue-700' : ''}">${player.name}</span>
                        </div>
                        <span class="text-sm font-black ${player.score < 0 ? 'text-red-500' : 'text-emerald-500'}">${player.score}</span>
                    </li>
                `;
            });
        }

        // Exposed function for iframes to call
        window.updateScore = function(points) {
            window.studentScore += points;
            const myData = leaderboardData.find(p => p.isMe);
            if(myData) myData.score = window.studentScore;
            
            renderLeaderboard();
            
            // Pop effect
            const lbWidget = document.getElementById('leaderboard-widget');
            lbWidget.style.transform = 'scale(1.05)';
            setTimeout(() => { lbWidget.style.transform = 'scale(1)'; }, 200);
        };


        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function hideLoader() {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 300);
        }

        function setActive(element, colorType) {
            // Close sidebar on mobile
            if (window.innerWidth < 768) {
                toggleSidebar();
            }

            // Show loader
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            // Force a reflow
            void loader.offsetWidth;
            loader.style.opacity = '1';

            // Reset all items
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
                el.classList.add('text-slate-700');
                el.style.background = '';
                el.style.boxShadow = '';
                
                // Restore icon colors
                const icon = el.querySelector('.nav-icon');
                icon.className = 'w-10 h-10 rounded-lg flex items-center justify-center mr-3 nav-icon transition-colors';
                if(el.href.includes('3')) { icon.classList.add('bg-blue-100', 'text-blue-600'); }
                if(el.href.includes('4')) { icon.classList.add('bg-emerald-100', 'text-emerald-600'); }
                if(el.href.includes('力')) { icon.classList.add('bg-orange-100', 'text-orange-600'); }
            });
            
            // Set active class
            element.classList.add('active');
            element.classList.remove('text-slate-700');
            
            // Update active item styles
            if (colorType === 'emerald') {
                element.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                element.style.boxShadow = '0 4px 15px rgba(16, 185, 129, 0.3)';
            } else if (colorType === 'orange') {
                element.style.background = 'linear-gradient(135deg, #f97316, #ea580c)';
                element.style.boxShadow = '0 4px 15px rgba(249, 115, 22, 0.3)';
            } else {
                element.style.background = 'linear-gradient(135deg, #3b82f6, #2563eb)';
                element.style.boxShadow = '0 4px 15px rgba(37, 99, 235, 0.3)';
            }
            
            // Make active icon white
            const icon = element.querySelector('.nav-icon');
            icon.className = 'w-10 h-10 rounded-lg bg-white/20 text-white flex items-center justify-center mr-3 nav-icon transition-colors';
        }
    </script>
</body>
</html>
